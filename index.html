<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculator --App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator" role="application" aria-label="Calculator">

    <header class="calc-header">
      <div class="left-controls">
        <!-- Theme toggle (sun / moon) -->
        <button id="themeToggle" class="theme-btn" aria-pressed="false" aria-label="Toggle theme">
          <svg id="themeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path id="sunPath" d="M12 3v2M12 19v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle id="sunCore" cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6" />
          </svg>
        </button>

        <!-- Sound toggle -->
        <button id="soundToggle" class="theme-btn" aria-pressed="true" aria-label="Toggle click sounds">
          <svg id="soundIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 9v6h4l5 4V5L9 9H5z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path id="soundWave1" d="M16.5 8.5c.8 1.2.8 2.8 0 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <path id="soundWave2" d="M18.5 6.5c1.6 2.3 1.6 5.5 0 7.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="title">Calculator</div>

      <div class="right-controls">
        <!-- History button -->
        <button id="historyToggle" class="theme-btn" aria-pressed="false" aria-label="Open history">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.6-6.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="mode">
          <label class="mode-toggle" title="Degrees / Radians">
            <input id="angleToggle" type="checkbox" />
            <span id="angleLabel">DEG</span>
          </label>
        </div>
      </div>
    </header>

    <div class="display-area">
      <div id="memoryIndicator" class="memory-indicator" aria-hidden="true" title="Click to recall memory"></div>
      <input id="display" class="display" type="text" inputmode="none" aria-label="Calculator display" readonly />
    </div>

    <div class="buttons-grid" role="grid" aria-label="Calculator buttons">
      <!-- memory / clear row -->
      <button class="btn func" data-action="mplus">M+</button>
      <button class="btn func" data-action="mminus">M-</button>
      <button class="btn func" data-action="mr">MR</button>
      <button class="btn func" data-action="mc">MC</button>

      <!-- Trig functions (insert function token into expression) -->
      <button class="btn op" data-action="fn" data-value="sin(">sin</button>
      <button class="btn op" data-action="fn" data-value="cos(">cos</button>
      <button class="btn op" data-action="fn" data-value="tan(">tan</button>
      <button class="btn op" data-action="fn" data-value="sec(">sec</button>

      <button class="btn op" data-action="fn" data-value="csc(">csc</button>
      <button class="btn op" data-action="fn" data-value="cot(">cot</button>
      <button class="btn op" data-action="fn" data-value="asin(">asin</button>
      <button class="btn op" data-action="fn" data-value="acos(">acos</button>

      <button class="btn op" data-action="fn" data-value="atan(">atan</button>
      <button class="btn op" data-action="sqrt">√</button>
      <button class="btn func" data-action="square">x²</button>
      <button class="btn paren" data-value="(">(</button>

      <!-- digits and basic ops -->
      <button class="btn num" data-value="7">7</button>
      <button class="btn num" data-value="8">8</button>
      <button class="btn num" data-value="9">9</button>
      <button class="btn op" data-value="/">÷</button>

      <button class="btn num" data-value="4">4</button>
      <button class="btn num" data-value="5">5</button>
      <button class="btn num" data-value="6">6</button>
      <button class="btn op" data-value="*">×</button>

      <button class="btn num" data-value="1">1</button>
      <button class="btn num" data-value="2">2</button>
      <button class="btn num" data-value="3">3</button>
      <button class="btn op" data-value="-">−</button>

      <button class="btn num" data-value="0">0</button>
      <button class="btn num" data-value=".">.</button>
      <button class="btn paren" data-value=")">)</button>
      <button class="btn op" data-value="+">+</button>

      <!-- equals spans full width at bottom -->
      <button class="btn wide" data-action="equals">=</button>
    </div>

    <footer class="calc-footer">
      <small>Professional • Clean • Lightweight</small>
    </footer>
  </main>

  <!-- History drawer / panel -->
  <aside id="historyPanel" class="history-panel" aria-hidden="true">
    <header class="history-header">
      <h3>History</h3>
      <div class="history-actions">
        <button id="clearHistoryBtn" class="chip">Clear All</button>
        <button id="closeHistoryBtn" class="chip">Close</button>
      </div>
    </header>
    <div id="historyList" class="history-list" role="list"></div>
    <footer class="history-footer"><small>Click an item to recall result or expression</small></footer>
  </aside>

  <script src="core.js"></script>
</body>
</html>
